spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:25}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Edamam Food Database API
diet.edamam.enabled=${EDAMAM_ENABLED:true}
diet.edamam.app-id=${EDAMAM_APP_ID:}
diet.edamam.app-key=${EDAMAM_APP_KEY:}
diet.edamam.base-url=${EDAMAM_BASE_URL:https://api.edamam.com}
diet.edamam.account-user=${EDAMAM_ACCOUNT_USER:}

# CREF validation (hybrid)
cref.validation.auto-lookup-enabled=${CREF_AUTO_LOOKUP_ENABLED:false}
cref.validation.auto-lookup-url-template=${CREF_AUTO_LOOKUP_URL_TEMPLATE:}
cref.validation.manual-url-template=${CREF_MANUAL_URL_TEMPLATE:https://www.confef.org.br/confef/registrados/}
cref.validation.auto-timeout-seconds=${CREF_AUTO_LOOKUP_TIMEOUT_SECONDS:8}

# E-mail (SMTP)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTIONTIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITETIMEOUT:10000}
app.mail.from=${MAIL_FROM:no-reply@fitmatch.page}
app.mail.enabled=${MAIL_ENABLED:true}


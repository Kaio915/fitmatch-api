# ATENÇÃO: com Gmail SMTP, o MAIL_FROM deve ser o MESMO e-mail da conta.
# O Google reescreve o remetente para a conta autenticada, então não dá para
# enviar como no-reply@fitmatch.page sem configurar "Enviar como" no Gmail.
